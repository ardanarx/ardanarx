    <!-- =====================================================

    <style>

        /* =====================================================
           NOTES PAGE
        ====================================================== */

        .notes-page {
            padding: 150px 24px 100px;
        }


        .notes-container {
            max-width: 690px;
            margin: 0 auto;
        }


        /* =====================================================
           NOTES HEADER
        ====================================================== */

        .notes-header {
            margin-bottom: 80px;
        }


        .notes-header h1 {
            margin: 0 0 24px;

            font-family: var(--serif);
            font-size: clamp(48px, 8vw, 68px);
            line-height: 1.05;
            font-weight: 400;

            color: var(--text);
        }


        .notes-header p {
            max-width: 620px;
            margin: 0;

            font-family: var(--sans);
            font-size: 18px;
            line-height: 1.8;

            color: var(--text-soft);
        }


        /* =====================================================
           NOTES LIST
        ====================================================== */

        .notes-list {
            border-top: 1px solid var(--border);
        }


        /* =====================================================
           NOTE CARD
        ====================================================== */

        .note-card {
            display: block;

            padding: 34px 0;

            border-bottom: 1px solid var(--border);

            text-decoration: none;

            transition:
                padding-left 0.3s ease,
                opacity 0.3s ease;
        }


        .note-card:hover {
            padding-left: 10px;
        }


        /* =====================================================
           CATEGORY
        ====================================================== */

        .note-card-category {
            margin-bottom: 12px;

            font-family: var(--sans);
            font-size: 12px;
            font-weight: 600;

            letter-spacing: 0.08em;
            text-transform: uppercase;

            color: var(--text-soft);
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .note-card h2 {
            margin: 0 0 12px;

            font-family: var(--serif);
            font-size: 30px;
            line-height: 1.25;
            font-weight: 400;

            color: var(--text);
        }


        /* =====================================================
           DESCRIPTION
        ====================================================== */

        .note-card p {
            max-width: 620px;
            margin: 0;

            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.8;

            color: var(--text-soft);
        }


        /* =====================================================
           DATE
        ====================================================== */

        .note-card-date {
            display: block;

            margin-top: 18px;

            font-family: var(--sans);
            font-size: 12px;
            line-height: 1.5;

            color: var(--text-soft);
        }


        /* =====================================================
           READ NOTE
        ====================================================== */

        .note-read {
            display: inline-block;

            margin-top: 20px;

            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;

            color: var(--text);
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .notes-loading {
            padding: 40px 0;

            font-family: var(--sans);
            font-size: 14px;

            color: var(--text-soft);
        }


        /* =====================================================
           EMPTY STATE
        ====================================================== */

        .notes-empty {
            padding: 40px 0;

            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.8;

            color: var(--text-soft);
        }


        /* =====================================================
           ERROR
        ====================================================== */

        .notes-error {
            padding: 40px 0;

            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.8;

            color: var(--text-soft);
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 700px) {

            .notes-page {
                padding-top: 125px;
            }


            .notes-header {
                margin-bottom: 60px;
            }


            .notes-header h1 {
                font-size: 52px;
            }


            .notes-header p {
                font-size: 17px;
            }


            .note-card {
                padding: 30px 0;
            }


            .note-card h2 {
                font-size: 27px;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ====================================================== */

        @media (max-width: 420px) {

            .notes-header h1 {
                font-size: 46px;
            }


            .note-card h2 {
                font-size: 25px;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ====================================================== */

        @media (prefers-reduced-motion: reduce) {

            .note-card {
                transition: none;
            }

        }

    </style>

<script>(function(){try{if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.classList.add('dark-mode');}}catch(e){}})();</script>

                    <h1>

                <!-- =================================================

    <!-- =====================================================
         SUPABASE + NOTES SCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIG
        ====================================================== */

        const SUPABASE_URL =
            "https://isqimtsaeuvceijapddj.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_SrJsbjs-_hunnBhCTlKywA_JxtScx3t";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );



        /* =====================================================
           DOM
        ====================================================== */

        const notesList =
            document.getElementById("notesList");



        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }



        /* =====================================================
           FORMAT DATE
        ====================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "";
            }

            const date =
                new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            return new Intl.DateTimeFormat(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            ).format(date);

        }



        /* =====================================================
           LOAD PUBLISHED NOTES
        ====================================================== */

        async function loadNotes() {

            notesList.innerHTML = `
                <div class="notes-loading">
                    Loading notes...
                </div>
            `;


            const {
                data,
                error
            } = await supabaseClient
                .from("notes")
                .select(`
                    id,
                    title,
                    slug,
                    excerpt,
                    status,
                    published_at,
                    created_at
                `)
                .eq("status", "published")
                .order(
                    "published_at",
                    {
                        ascending: false
                    }
                );


            /* =================================================
               ERROR
            ================================================== */

            if (error) {

                console.error(
                    "Failed to load notes:",
                    error
                );

                notesList.innerHTML = `
                    <div class="notes-error">
                        Unable to load notes right now.
                        Please try again later.
                    </div>
                `;

                return;
            }



            /* =================================================
               EMPTY
            ================================================== */

            if (!data || data.length === 0) {

                notesList.innerHTML = `
                    <div class="notes-empty">
                        No published notes yet.
                    </div>
                `;

                return;
            }



            /* =================================================
               RENDER
            ================================================== */

            notesList.innerHTML =
                data.map(note => {

                    const title =
                        escapeHTML(
                            note.title
                        );


                    const excerpt =
                        escapeHTML(
                            note.excerpt ||
                            "A note by Ardanarx."
                        );


                    const slug =
                        encodeURIComponent(
                            note.slug || ""
                        );


                    const date =
                        formatDate(
                            note.published_at ||
                            note.created_at
                        );


                    return `
                        <a
                            href="article.html?slug=${slug}"
                            class="note-card"
                        >

                            <div class="note-card-category">
                                Ardanarx Notes
                            </div>

                            <h2>
                                ${title}
                            </h2>

                            <p>
                                ${excerpt}
                            </p>

                            ${
                                date
                                    ? `
                                        <span class="note-card-date">
                                            ${date}
                                        </span>
                                      `
                                    : ""
                            }

                            <span class="note-read">
                                Read Note →
                            </span>

                        </a>
                    `;

                }).join("");

        }



        /* =====================================================
           INITIALIZE
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadNotes();

            }
        );

    </script>



    <!-- =====================================================

    <script src="../script.js"></script>
