    <style>

        /* =====================================================
           ARTICLE PAGE
        ====================================================== */

        .article-page {
            padding: 150px 24px 100px;
        }


        .article-container {
            max-width: 690px;
            margin: 0 auto;
        }


        /* =====================================================
           ARTICLE HEADER
        ====================================================== */

        .article-header {
            margin-bottom: 70px;
        }


        .article-category {
            margin-bottom: 18px;

            font-family: var(--sans);
            font-size: 12px;
            font-weight: 600;

            letter-spacing: 0.08em;
            text-transform: uppercase;

            color: var(--text-soft);
        }


        .article-title {
            margin: 0 0 24px;

            font-family: var(--serif);
            font-size: clamp(46px, 7vw, 68px);
            line-height: 1.08;
            font-weight: 400;

            color: var(--text);
        }


        .article-date {
            font-family: var(--sans);
            font-size: 13px;

            color: var(--text-soft);
        }


        /* =====================================================
           ARTICLE CONTENT
        ====================================================== */

        .article-content {
            font-family: var(--sans);
            font-size: 17px;
            line-height: 1.9;

            color: var(--text);
        }


        .article-content p {
            margin: 0 0 28px;
        }


        .article-content h2 {
            margin: 55px 0 20px;

            font-family: var(--serif);
            font-size: 34px;
            line-height: 1.25;
            font-weight: 400;

            color: var(--text);
        }


        .article-content h3 {
            margin: 42px 0 16px;

            font-family: var(--serif);
            font-size: 27px;
            line-height: 1.3;
            font-weight: 400;

            color: var(--text);
        }


        .article-content ul,
        .article-content ol {
            margin: 0 0 30px;
            padding-left: 25px;
        }


        .article-content li {
            margin-bottom: 10px;
        }


        .article-content blockquote {
            margin: 40px 0;
            padding-left: 24px;

            border-left: 2px solid var(--border);

            font-family: var(--serif);
            font-size: 24px;
            line-height: 1.5;

            color: var(--text-soft);
        }


        .article-content a {
            color: var(--text);
            text-decoration: underline;
            text-underline-offset: 4px;
        }


        .article-content code {
            padding: 3px 6px;

            border-radius: 4px;

            background: var(--bg-soft);

            font-family: monospace;
            font-size: 0.9em;
        }


        .article-content pre {
            overflow-x: auto;

            margin: 35px 0;
            padding: 20px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--bg-soft);

            font-family: monospace;
            font-size: 14px;
            line-height: 1.7;
        }


        .article-content pre code {
            padding: 0;

            background: transparent;
        }


        /* =====================================================
           BACK LINK
        ====================================================== */

        .article-back {
            display: inline-block;

            margin-top: 70px;

            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;

            color: var(--text);

            text-decoration: none;

            transition: opacity 0.3s ease;
        }


        .article-back:hover {
            opacity: 0.6;
        }


        /* =====================================================
           LOADING / ERROR
        ====================================================== */

        .article-loading,
        .article-error {
            padding: 40px 0;

            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.8;

            color: var(--text-soft);
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 700px) {

            .article-page {
                padding-top: 125px;
            }


            .article-header {
                margin-bottom: 55px;
            }


            .article-title {
                font-size: 48px;
            }


            .article-content {
                font-size: 16px;
                line-height: 1.85;
            }


            .article-content h2 {
                font-size: 31px;
            }


            .article-content h3 {
                font-size: 25px;
            }


            .article-content blockquote {
                font-size: 21px;
            }

        }


        @media (max-width: 420px) {

            .article-title {
                font-size: 42px;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ====================================================== */

        @media (prefers-reduced-motion: reduce) {

            .article-back {
                transition: none;
            }

        }

    </style>

<body>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <article class="article-page">

            <div class="article-container">


                <!-- =================================================
                     ARTICLE HEADER
                ================================================== -->

                <header class="article-header">

                    <div
                        class="article-category"
                        id="articleCategory"
                    >
                        Ardanarx Notes
                    </div>


                    <h1
                        class="article-title"
                        id="articleTitle"

                        Loading...
                    </h1>

    <!-- =====================================================
         ARTICLE SCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIG
        ====================================================== */

        const SUPABASE_URL =
            "https://isqimtsaeuvceijapddj.supabase.co";


        const SUPABASE_ANON_KEY =
            "PASTE_YOUR_CURRENT_PUBLISHABLE_ANON_KEY_HERE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );



        /* =====================================================
           DOM
        ====================================================== */

        const articleTitle =
            document.getElementById(
                "articleTitle"
            );


        const articleCategory =
            document.getElementById(
                "articleCategory"
            );


        const articleDate =
            document.getElementById(
                "articleDate"
            );


        const articleContent =
            document.getElementById(
                "articleContent"
            );


        const pageTitle =
            document.getElementById(
                "pageTitle"
            );


        const metaDescription =
            document.getElementById(
                "metaDescription"
            );



        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }



        /* =====================================================
           FORMAT DATE
        ====================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "";
            }

            const date =
                new Date(dateValue);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return "";
            }


            return new Intl.DateTimeFormat(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            ).format(date);

        }



        /* =====================================================
           CONTENT FORMATTER
        ====================================================== */

        function formatContent(content) {

            if (!content) {
                return "";
            }


            /*
             * Content is currently stored as plain text.
             *
             * Empty lines become paragraphs.
             */

            const safeContent =
                escapeHTML(content);


            return safeContent
                .split(/\n\s*\n/)
                .map(paragraph => {

                    const cleaned =
                        paragraph
                            .trim()
                            .replace(/\n/g, "<br>");

                    if (!cleaned) {
                        return "";
                    }

                    return `
                        <p>
                            ${cleaned}
                        </p>
                    `;

                })
                .join("");

        }



        /* =====================================================
           GET SLUG
        ====================================================== */

        function getSlug() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("slug");

        }



        /* =====================================================
           LOAD ARTICLE
        ====================================================== */

        async function loadArticle() {

            const slug =
                getSlug();


            /* =================================================
               NO SLUG
            ================================================== */

            if (!slug) {

                showError(
                    "The requested note could not be found."
                );

                return;
            }



            /* =================================================
               DATABASE QUERY
            ================================================== */

            const {
                data,
                error
            } = await supabaseClient
                .from("notes")
                .select(`
                    id,
                    title,
                    slug,
                    excerpt,
                    content,
                    status,
                    published_at,
                    created_at
                `)
                .eq(
                    "slug",
                    slug
                )
                .eq(
                    "status",
                    "published"
                )
                .maybeSingle();



            /* =================================================
               DATABASE ERROR
            ================================================== */

            if (error) {

                console.error(
                    "Failed to load article:",
                    error
                );

                showError(
                    "Unable to load this note right now."
                );

                return;
            }



            /* =================================================
               ARTICLE NOT FOUND
            ================================================== */

            if (!data) {

                showError(
                    "This note does not exist or has not been published."
                );

                return;
            }



            /* =================================================
               RENDER ARTICLE
            ================================================== */

            renderArticle(data);

        }



        /* =====================================================
           RENDER ARTICLE
        ====================================================== */

        function renderArticle(note) {

            const title =
                note.title ||
                "Untitled Note";


            const excerpt =
                note.excerpt ||
                "A note by Ardanarx.";


            const date =
                formatDate(
                    note.published_at ||
                    note.created_at
                );


            articleTitle.textContent =
                title;


            articleCategory.textContent =
                "Ardanarx Notes";


            articleDate.textContent =
                date;


            articleContent.innerHTML =
                formatContent(
                    note.content ||
                    excerpt
                );


            pageTitle.textContent =
                `${title} — Ardanarx`;


            metaDescription.setAttribute(
                "content",
                excerpt
            );

        }



        /* =====================================================
           ERROR STATE
        ====================================================== */

        function showError(message) {

            articleTitle.textContent =
                "Note Not Found";


            articleCategory.textContent =
                "Ardanarx Notes";


            articleDate.textContent =
                "";


            articleContent.innerHTML = `
                <div class="article-error">
                    ${escapeHTML(message)}
                </div>
            `;


            pageTitle.textContent =
                "Note Not Found — Ardanarx";

        }



        /* =====================================================
           INITIALIZE
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadArticle();

            }
        );

    </script>



    <!-- =====================================================
         MAIN SITE SCRIPT
    ====================================================== -->

    <script src="../script.js"></script>

</body>
