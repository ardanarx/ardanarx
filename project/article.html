    <style>

        /* =====================================================
           PROJECT DETAIL
        ====================================================== */

        .project-detail-hero {
            padding: 150px 24px 95px;
        }

        .project-detail-inner {
            max-width: 900px;
            margin: 0 auto;
        }


        /* =====================================================
           LABEL
        ====================================================== */

        .project-detail-label {
            display: block;
            margin-bottom: 24px;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .project-detail-title {
            max-width: 850px;
            margin: 0 0 25px;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: clamp(58px, 8vw, 86px);
            line-height: 0.98;
            letter-spacing: -3px;
            font-weight: 400;
        }


        /* =====================================================
           INTRO
        ====================================================== */

        .project-detail-intro {
            max-width: 650px;
            margin: 0;
            color: var(--text-soft);
            font-size: 17px;
            line-height: 1.75;
        }


        /* =====================================================
           META
        ====================================================== */

        .project-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 750px;
            margin-top: 60px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
        }

        .project-meta-item span {
            display: block;
        }

        .project-meta-label {
            margin-bottom: 8px;
            color: var(--text-soft);
            font-size: 12px;

            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .project-meta-value {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }


        /* =====================================================
           CONTENT
        ====================================================== */

        .project-detail-content {
            max-width: 690px;
            margin: 0 auto;
            padding: 0 24px 100px;
        }

        .project-detail-content section {
            margin-bottom: 65px;
        }

        .project-detail-content h2 {
            margin: 0 0 20px;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 38px;
            line-height: 1.15;
            letter-spacing: -1px;
            font-weight: 400;
        }

        .project-detail-content h3 {
            margin: 35px 0 14px;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 400;
        }

        .project-detail-content p {
            margin: 0 0 20px;
            color: var(--text-soft);
            font-size: 15.5px;
            line-height: 1.85;
        }

        .project-detail-content ul,
        .project-detail-content ol {
            margin: 0 0 25px;
            padding-left: 22px;
            color: var(--text-soft);
        }

        .project-detail-content li {
            margin-bottom: 10px;
            font-size: 15.5px;
            line-height: 1.75;
        }

        .project-detail-content strong,
        .project-detail-content b {
            color: var(--text);
            font-weight: 700;
        }

        .project-detail-content em,
        .project-detail-content i {
            font-style: italic;
        }

        .project-detail-content a {
            color: var(--text);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
        }


        /* =====================================================
           FEATURE LIST
        ====================================================== */

        .feature-list {
            display: grid;
            gap: 0;
            margin-top: 25px;
            border-top: 1px solid var(--border);
        }

        .feature-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);

            margin-bottom: 7px;
            color: var(--text);

            font-size: 14px;
            line-height: 1.7;

           TECHNOLOGY

            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-top: 25px;

        .technology-item {
            color: var(--text-soft);

            font-weight: 600;

            margin: 75px 0;
            padding: 35px 0;
            border-top: 1px solid var(--border);

            margin: 0;
            font-family: "DM Serif Display", Georgia, serif;
            color: var(--text);
            font-size: 28px;
            line-height: 1.35;
            letter-spacing: -0.5px;
        }


        /* =====================================================
           PROJECT LINKS
        ====================================================== */

        .project-explore {
            margin-top: 75px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }

        .project-explore-title {
            margin-bottom: 20px;
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .project-explore-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 25px;
        }

        .project-explore-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-bottom: 1px solid currentColor;
            padding-bottom: 3px;
        }

            opacity: 0.55;

        /* =====================================================
           BACK
        ====================================================== */

        .project-back {
            max-width: 690px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .project-back a {
            color: var(--text-soft);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .project-back a:hover {

        /* =====================================================
           LOADING / ERROR
        ====================================================== */

        .project-state {
            max-width: 690px;
            margin: 0 auto;
            padding: 120px 24px;
        }

        .project-state h1 {
            margin: 0 0 15px;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 48px;
            line-height: 1.1;

        }

        .project-state p {

            color: var(--text-soft);
            font-size: 15px;
            line-height: 1.75;
        }


        /* =====================================================
           THUMBNAIL
        ====================================================== */

        .project-thumbnail {
            width: 100%;
            margin-top: 60px;
            overflow: hidden;
        }

        .project-thumbnail img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 2px;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .project-detail-hero {
                padding: 125px 28px 75px;
            }

            .project-detail-title {
                font-size: 50px;
                letter-spacing: -2px;
            }

            .project-detail-intro {
                font-size: 15px;
            }

            .project-meta {
                grid-template-columns: 1fr;
                gap: 22px;
                margin-top: 45px;
            }

            .project-detail-content {
                padding: 0 28px 75px;
            }

            .project-detail-content h2 {
                font-size: 34px;
            }

            .project-detail-content h3 {
                font-size: 27px;
            }

            .project-detail-content p,

                font-size: 15px;
            }

            }

                margin-top: 45px;
            }

            .project-back {
                padding: 0 28px 65px;
            }

            .project-state {
                padding: 110px 28px;
            }

        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =====================================================
           SUPABASE CONFIG
        ====================================================== */

        const SUPABASE_URL =
            "https://isqimtsaeuvceijapddj.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_SrJsbjs-_hunnBhCTlKyYwA_JxtScx3t";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const projectLoading =
            document.getElementById(
                "projectLoading"
            );

        const projectError =
            document.getElementById(
                "projectError"
            );

        const projectErrorText =
            document.getElementById(
                "projectErrorText"
            );

        const projectContent =
            document.getElementById(
                "projectContent"
            );

        const projectLabel =
            document.getElementById(
                "projectLabel"
            );

        const projectTitle =
            document.getElementById(
                "projectTitle"
            );

        const projectDescription =
            document.getElementById(
                "projectDescription"
            );

        const projectType =
            document.getElementById(
                "projectType"
            );

        const projectFocus =
            document.getElementById(
                "projectFocus"
            );

        const projectStatus =
            document.getElementById(
                "projectStatus"
            );

        const projectThumbnail =
            document.getElementById(
                "projectThumbnail"
            );

        const projectBody =
            document.getElementById(
                "projectBody"
            );

        const projectExplore =
            document.getElementById(
                "projectExplore"
            );

        const projectExploreLinks =
            document.getElementById(
                "projectExploreLinks"
            );


        /* =====================================================
           URL
        ====================================================== */

        function getSlug() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return String(
                params.get("slug") || ""
            ).trim();

        }


        /* =====================================================
           HTML SANITIZER
        ====================================================== */

        function sanitizeHTML(html) {

            const template =
                document.createElement("template");

            template.innerHTML =
                String(html || "");


            const allowedTags = new Set([
                "P",
                "BR",
                "H2",
                "H3",
                "H4",
                "STRONG",
                "B",
                "EM",
                "I",
                "UL",
                "OL",
                "LI",
                "BLOCKQUOTE",
                "A",
                "CODE",
                "PRE",
                "IMG",
                "HR"
            ]);


            const allowedAttributes = {
                A: new Set([
                    "href",
                    "target",
                    "rel"
                ]),
                IMG: new Set([
                    "src",
                    "alt",
                    "title"
                ])
            };


            const walker =
                document.createTreeWalker(
                    template.content,
                    NodeFilter.SHOW_ELEMENT
                );


            const elements = [];


            while (walker.nextNode()) {

                elements.push(
                    walker.currentNode
                );

            }


            elements.forEach(element => {

                const tag =
                    element.tagName;


                if (
                    !allowedTags.has(tag)
                ) {

                    element.replaceWith(
                        ...Array.from(
                            element.childNodes
                        )
                    );

                    return;

                }


                Array.from(
                    element.attributes
                ).forEach(attribute => {

                    const name =
                        attribute.name.toLowerCase();


                    const allowed =
                        allowedAttributes[tag];


                    if (
                        !allowed ||
                        !allowed.has(name)
                    ) {

                        element.removeAttribute(
                            attribute.name
                        );

                    }

                });


                if (tag === "A") {

                    const href =
                        element.getAttribute(
                            "href"
                        );


                    if (
                        !href ||
                        !/^(https?:|mailto:|tel:)/i.test(
                            href
                        )
                    ) {

                        element.removeAttribute(
                            "href"
                        );

                    } else {

                        element.setAttribute(
                            "target",
                            "_blank"
                        );

                        element.setAttribute(
                            "rel",
                            "noopener noreferrer"
                        );

                    }

                }


                if (tag === "IMG") {

                    const src =
                        element.getAttribute(
                            "src"
                        );


                    if (
                        !src ||
                        !/^(https?:|data:image\/)/i.test(
                            src
                        )
                    ) {

                        element.removeAttribute(
                            "src"
                        );

                    }

                }

            });


            return template.innerHTML;

        }


        /* =====================================================
           CONTENT FORMAT
        ====================================================== */

        function formatContent(content) {

            if (!content) {
                return "";
            }


            const value =
                String(content).trim();


            if (!value) {
                return "";
            }


            const looksLikeHTML =
                /<\s*(p|h2|h3|h4|ul|ol|li|blockquote|strong|em|a|img|hr|pre|code)\b/i
                    .test(value);


            if (looksLikeHTML) {

                return sanitizeHTML(
                    value
                );

            }


            return escapeHTML(value)
                .replace(/\n{2,}/g, "</p><p>")
                .replace(/\n/g, "<br>");


        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(value) {

            return String(
                value ?? ""
            )
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           CATEGORY
        ====================================================== */

        function getCategory(
            project
        ) {

            const title =
                String(
                    project.title || ""
                ).toLowerCase();


            if (
                title.includes("vervocare")
            ) {

                return "BUSINESS & DIGITAL SYSTEM";

            }


            if (
                title.includes("kostiqo")
            ) {

                return "PROPERTY & DIGITAL SYSTEM";

            }


            if (
                title.includes("nerforit")
            ) {

                return "TECHNOLOGY & E-COMMERCE";

            }


            return "DIGITAL PROJECT";

        }


        /* =====================================================
           PROJECT TYPE
        ====================================================== */

        function getProjectType(
            project
        ) {

            const category =
                getCategory(
                    project
                );


            if (
                category.includes(
                    "BUSINESS"
                )
            ) {

                return "Business Project";

            }


            if (
                category.includes(
                    "PROPERTY"
                )
            ) {

                return "Property Project";

            }


            if (
                category.includes(
                    "TECHNOLOGY"
                )
            ) {

                return "Technology Project";

            }


            return "Digital Project";

        }


        /* =====================================================
           PROJECT FOCUS
        ====================================================== */

        function getProjectFocus(
            project
        ) {

            if (
                Array.isArray(
                    project.tech_stack
                ) &&
                project.tech_stack.length
            ) {

                return project.tech_stack
                    .slice(0, 3)
                    .join(" · ");

            }


            return "Digital System";

        }


        /* =====================================================
           THUMBNAIL
        ====================================================== */

        function renderThumbnail(
            project
        ) {

            if (
                !project.thumbnail
            ) {

                return;

            }


            const image =
                document.createElement("img");


            image.src =
                String(
                    project.thumbnail
                ).trim();


            image.alt =
                String(
                    project.title ||
                    "Project"
                );


            image.loading =
                "lazy";


            image.referrerPolicy =
                "no-referrer";


            image.onerror =
                () => {

                    projectThumbnail.hidden =
                        true;

                    projectThumbnail.innerHTML =
                        "";

                };


            projectThumbnail.appendChild(
                image
            );


            projectThumbnail.hidden =
                false;

        }


        /* =====================================================
           EXPLORE LINKS
        ====================================================== */

        function renderExploreLinks(
            project
        ) {

            projectExploreLinks.innerHTML =
                "";

            let hasLink =
                false;


            if (
                project.project_url
            ) {

                const website =
                    createSafeLink(
                        project.project_url,
                        "Visit Website"
                    );


                if (website) {

                    projectExploreLinks.appendChild(
                        website
                    );

                    hasLink = true;

                }

            }


            if (
                project.github_url
            ) {

                const github =
                    createSafeLink(
                        project.github_url,
                        "View on GitHub"
                    );


                if (github) {

                    projectExploreLinks.appendChild(
                        github
                    );

                    hasLink = true;

                }

            }


            if (hasLink) {

                projectExplore.hidden =
                    false;

            } else {

                projectExplore.hidden =
                    true;

            }

        }


        /* =====================================================
           SAFE LINK
        ====================================================== */

        function createSafeLink(
            url,
            text
        ) {

            const value =
                String(
                    url || ""
                ).trim();


            if (
                !/^https?:\/\//i.test(
                    value
                )
            ) {

                return null;

            }


            const link =
                document.createElement("a");


            link.href =
                value;


            link.textContent =
                text;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            return link;

        }


        /* =====================================================
           RENDER PROJECT
        ====================================================== */

        function renderProject(
            project
        ) {

            const category =
                getCategory(
                    project
                );


            projectLabel.textContent =
                `PROJECT — ${category}`;


            projectTitle.textContent =
                project.title ||
                "Untitled Project";


            projectDescription.textContent =
                project.description ||
                "";


            projectType.textContent =
                getProjectType(
                    project
                );


            projectFocus.textContent =
                getProjectFocus(
                    project
                );


            projectStatus.textContent =
                project.status === "published"
                    ? "Published"
                    : "Draft";


            projectThumbnail.innerHTML =
                "";

            projectThumbnail.hidden =
                true;


            renderThumbnail(
                project
            );


            projectBody.innerHTML =
                formatContent(
                    project.content
                );


            renderExploreLinks(
                project
            );


            projectLoading.hidden =
                true;

            projectError.hidden =
                true;

            projectContent.hidden =
                false;


            document.title =
                `${project.title || "Project"} — Ardanarx`;

        }


        /* =====================================================
           LOAD PROJECT
        ====================================================== */

        async function loadProject() {

            const slug =
                getSlug();


            if (!slug) {

                projectLoading.hidden =
                    true;

                projectError.hidden =
                    false;

                projectErrorText.textContent =
                    "No project slug was provided.";

                return;

            }


            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("projects")

                    .select(`
                        id,
                        title,
                        slug,
                        description,
                        content,
                        thumbnail,
                        tech_stack,
                        project_url,
                        github_url,
                        status,
                        featured,
                        sort_order,
                        published_at,
                        created_at
                    `)

                    .eq(
                        "slug",
                        slug
                    )

                    .eq(
                        "status",
                        "published"
                    )

                    .maybeSingle();


                if (error) {

                    throw error;

                }


                if (!data) {

                    projectLoading.hidden =
                        true;

                    projectError.hidden =
                        false;

                    projectErrorText.textContent =
                        "The project does not exist or has not been published yet.";

                    return;

                }


                renderProject(
                    data
                );


            } catch (error) {

                console.error(
                    "Project loading error:",
                    error
                );


                projectLoading.hidden =
                    true;

                projectError.hidden =
                    false;

                projectErrorText.textContent =
                    "Something went wrong while loading this project. Please try again later.";

            }

        }


        /* =====================================================
           START
        ====================================================== */

        loadProject();

    </script>


    <!-- =====================================================
         MAIN SITE SCRIPT
    ====================================================== -->

    <script src="../script.js"></script>


</body>
